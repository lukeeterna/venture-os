name: Sportswear Backoffice CI

on:
  pull_request:
    paths:
      - 'ventures/run_20260711_161411/sportswear-backoffice/**'
      - '.github/workflows/sportswear-backoffice-ci.yml'
  push:
    branches:
      - 'sol/mt3d-football-production-20260816'
    paths:
      - 'ventures/run_20260711_161411/sportswear-backoffice/**'
      - '.github/workflows/sportswear-backoffice-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sportswear
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sportswear
      STORE_CORS: http://127.0.0.1:8282
      ADMIN_CORS: http://127.0.0.1:9000
      AUTH_CORS: http://127.0.0.1:9000
      JWT_SECRET: ci-jwt-secret-not-for-production
      COOKIE_SECRET: ci-cookie-secret-not-for-production
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Medusa backend
        working-directory: ventures/run_20260711_161411/sportswear-backoffice
        run: npm install --no-audit --no-fund

      - name: Build backend and Admin
        working-directory: ventures/run_20260711_161411/sportswear-backoffice
        run: npm run build

      - name: Migrate database
        working-directory: ventures/run_20260711_161411/sportswear-backoffice
        run: npm run db:migrate

      - name: Initialize structural Sportswear catalog
        working-directory: ventures/run_20260711_161411/sportswear-backoffice
        run: npm run init:sportswear

      - name: Verify idempotent catalog initialization
        working-directory: ventures/run_20260711_161411/sportswear-backoffice
        run: |
          npm run init:sportswear | tee /tmp/sportswear-init-second.log
          grep -q 'SPORTSWEAR_CATALOG=ALREADY_PRESENT' /tmp/sportswear-init-second.log

      - name: Create ephemeral publishable key
        working-directory: ventures/run_20260711_161411/sportswear-backoffice
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          npx medusa exec ./src/scripts/create-ci-pak.ts | tee /tmp/sportswear-ci-pak.log
          PAK="$(sed -n 's/^SPORTSWEAR_CI_PAK=//p' /tmp/sportswear-ci-pak.log | tail -1)"
          test -n "$PAK"
          echo "SPORTSWEAR_CI_PAK=$PAK" >> "$GITHUB_ENV"

      - name: Start Medusa
        working-directory: ventures/run_20260711_161411/sportswear-backoffice
        run: |
          npm run start >/tmp/sportswear-medusa.log 2>&1 &
          echo $! >/tmp/sportswear-medusa.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/health >/dev/null; then
              echo "MEDUSA_HEALTH=PASS"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/sportswear-medusa.log
          exit 1

      - name: Admin bundle smoke
        run: |
          set -euo pipefail
          curl --fail --silent http://127.0.0.1:9000/app >/tmp/sportswear-admin.html
          grep -qi '<html' /tmp/sportswear-admin.html
          echo "MEDUSA_ADMIN=PASS"

      - name: Real catalog API smoke
        run: |
          set -euo pipefail
          curl --fail --silent \
            -H "x-publishable-api-key: $SPORTSWEAR_CI_PAK" \
            'http://127.0.0.1:9000/store/sportswear/catalog?currency_code=eur' \
            > /tmp/sportswear-catalog.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/sportswear-catalog.json'))
          assert data['version']=='sportswear-catalog-v1', data
          fabrics={x['sku'] for x in data['fabrics']}
          personal={x['sku'] for x in data['personalizations']}
          assert {'FABRIC_MATCH_145','FABRIC_PRO_130','FABRIC_ECO_160'} <= fabrics, fabrics
          assert {'CUSTOM_NAME','BACK_NUMBER','FRONT_NUMBER','CUSTOM_PATTERN','CUSTOM_COLLAR'} <= personal, personal
          print('SPORTSWEAR_CATALOG_API=PASS')
          PY

      - name: Real quote API fail-closed smoke
        run: |
          set -euo pipefail
          curl --fail --silent \
            -H "x-publishable-api-key: $SPORTSWEAR_CI_PAK" \
            -H 'content-type: application/json' \
            -d '{"currency_code":"eur","fabric_sku":"FABRIC_MATCH_145","quantity":1,"feature_units":[{"sku":"CUSTOM_NAME","units_per_kit":1},{"sku":"BACK_NUMBER","units_per_kit":1}],"roster":[{"id":1,"name":"ROSSI","number":"10","category":"men","role":"player","shirt_size":"M","shorts_size":"M","socks_size_eu":"39/42","quantity":1}]}' \
            http://127.0.0.1:9000/store/sportswear/quote \
            > /tmp/sportswear-quote.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/sportswear-quote.json'))
          assert data['quote_version']=='sportswear-medusa-v1', data
          assert data['priced'] is False, data
          missing=set(data['missing_skus'])
          assert {'FABRIC_MATCH_145','CUSTOM_NAME','BACK_NUMBER'} <= missing, missing
          print('SPORTSWEAR_QUOTE_FAIL_CLOSED=PASS')
          PY

      - name: Verify structural products directly
        working-directory: ventures/run_20260711_161411/sportswear-backoffice
        run: |
          npm run init:sportswear | tee /tmp/sportswear-init-third.log
          grep -q 'SPORTSWEAR_CATALOG=ALREADY_PRESENT' /tmp/sportswear-init-third.log
          echo "SPORTSWEAR_STRUCTURE=PASS"

      - name: Dump logs on failure
        if: failure()
        run: |
          cat /tmp/sportswear-medusa.log 2>/dev/null || true
          cat /tmp/sportswear-ci-pak.log 2>/dev/null || true
          cat /tmp/sportswear-catalog.json 2>/dev/null || true
          cat /tmp/sportswear-quote.json 2>/dev/null || true
