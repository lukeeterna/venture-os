name: Sportswear3D Visual CI

on:
  push:
    branches:
      - sol/mt3d-football-production-20260816
    paths:
      - ventures/run_20260711_161411/configurator/**
      - .github/workflows/sportswear3d-visual-ci.yml
  pull_request:
    branches:
      - master
    paths:
      - ventures/run_20260711_161411/configurator/**
      - .github/workflows/sportswear3d-visual-ci.yml

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout PR or branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static syntax and runtime assets
        id: static
        shell: bash
        run: |
          set -euo pipefail
          ROOT="ventures/run_20260711_161411/configurator"
          node --check "$ROOT/src/app.js"
          node --check "$ROOT/src/football-realism-prelude.js"
          node --check "$ROOT/src/bootstrap.js"
          node --check "$ROOT/src/football-realism.js"
          node --check "$ROOT/src/football-realism-post.js"
          node --check "$ROOT/verify/visual-ci.cjs"
          test -s "$ROOT/assets/vendor/football-shirt.glb"
          test -s "$ROOT/assets/vendor/football-shorts.glb"
          test -s "$ROOT/assets/vendor/football-socks.glb"
          grep -q 'football-real-garment-v4-conformal' "$ROOT/src/app.js"
          grep -q 'buildSurfaceOverlayGeometry' "$ROOT/src/app.js"
          grep -q 'football-realism-v5-20260822' "$ROOT/src/football-realism.js"
          grep -q 'src/bootstrap.js' "$ROOT/index.html"
          test -s "$ROOT/FOOTBALL_REALISM_REFERENCES.md"
          if grep -q 'DecalGeometry' "$ROOT/src/app.js"; then
            echo "Unexpected DecalGeometry runtime dependency"
            exit 1
          fi
          echo "STATIC_AND_RUNTIME_ASSETS=PASS"

      - name: Generate deterministic PNG fixtures
        shell: bash
        run: |
          set -euo pipefail
          ROOT="ventures/run_20260711_161411/configurator"
          mkdir -p "$ROOT/verify/fixtures" "$ROOT/verify/visual-output"
          rm -f "$ROOT/verify/visual-output"/*
          python3 - <<'PY'
          import pathlib, struct, zlib
          root = pathlib.Path('ventures/run_20260711_161411/configurator/verify/fixtures')
          def png(path, w, h, pixel):
              rows=[]
              for y in range(h):
                  row=bytearray([0])
                  for x in range(w): row.extend(pixel(x,y))
                  rows.append(bytes(row))
              raw=b''.join(rows)
              def chunk(kind,data):
                  return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
              out=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,6,0,0,0))+chunk(b'IDAT',zlib.compress(raw,9))+chunk(b'IEND',b'')
              path.write_bytes(out)
          png(root/'ci-pattern.png',64,64,lambda x,y: (40,105,220,255) if ((x//8+y//8)%2==0) else (245,245,245,255))
          png(root/'ci-logo.png',96,48,lambda x,y: (255,255,255,0) if (x<8 or x>87 or y<6 or y>41) else (220,35,50,255))
          PY

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/sportswear-pw
          cd /tmp/sportswear-pw
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Start static server
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/ventures/run_20260711_161411/configurator"
          python3 -m http.server 8282 --bind 127.0.0.1 --directory "$ROOT" >/tmp/sportswear-http.log 2>&1 &
          echo $! >/tmp/sportswear-http.pid
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8282/ >/dev/null; then
              echo "SERVER=PASS"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/sportswear-http.log
          exit 1

      - name: Real Chromium WebGL acceptance
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/ventures/run_20260711_161411/configurator"
          NODE_PATH=/tmp/sportswear-pw/node_modules SPORTSWEAR_URL=http://127.0.0.1:8282/ node "$ROOT/verify/visual-ci.cjs" 2>&1 | tee /tmp/sportswear-visual-ci.log

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportswear3d-visual-evidence
          path: ventures/run_20260711_161411/configurator/verify/visual-output
          if-no-files-found: warn
          retention-days: 7

      - name: Publish branch CI verdict
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          set -u
          OUT="docs/judge/2026-08-22-sportswear-football-realism-ci.md"
          mkdir -p "$(dirname "$OUT")"
          {
            echo "# Sportswear 3D Football Realism — CI verdict"
            echo
            echo "source_sha: $GITHUB_SHA"
            echo "static_outcome: ${{ steps.static.outcome }}"
            echo "browser_outcome: ${{ steps.browser.outcome }}"
            echo "workflow_run_id: $GITHUB_RUN_ID"
            echo
            echo '```text'
            if [ -f /tmp/sportswear-visual-ci.log ]; then
              cat /tmp/sportswear-visual-ci.log
            else
              echo "browser log unavailable (failure occurred before browser step)"
            fi
            echo '```'
          } > "$OUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(mt3d): publish football realism verdict"
          git push origin "HEAD:${GITHUB_REF_NAME}"
