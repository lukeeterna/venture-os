name: Sportswear3D Back Orientation Hotfix

on:
  push:
    branches:
      - sol/mt3d-football-production-20260816
    paths:
      - .github/workflows/sportswear3d-vendor-assets.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: sol/mt3d-football-production-20260816
          fetch-depth: 0

      - name: Apply Sol-authored back UV orientation fix
        shell: bash
        run: |
          set -euo pipefail
          APP="ventures/run_20260711_161411/configurator/src/app.js"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ventures/run_20260711_161411/configurator/src/app.js')
          s = p.read_text()
          old = '        uvs.push(col / cols, 1 - row / rows);'
          new = '        uvs.push(surfaceDef(surfaceId).side === "back" ? 1 - col / cols : col / cols, 1 - row / rows);'
          if new in s:
              print('BACK_UV_FIX_ALREADY_PRESENT=YES')
          else:
              assert old in s, 'expected conformal UV line not found'
              s = s.replace(old, new, 1)
              p.write_text(s)
              print('BACK_UV_FIX_APPLIED=YES')
          PY
          node --check "$APP"
          grep -Fq 'side === "back" ? 1 - col / cols : col / cols' "$APP"
          echo "BACK_UV_STATIC=PASS"

      - name: Commit orientation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sportswear3d-ci"
          git config user.email "sportswear3d-ci@users.noreply.github.com"
          git add ventures/run_20260711_161411/configurator/src/app.js
          if git diff --cached --quiet; then
            echo "No hotfix change required"
            exit 0
          fi
          git commit -m "sportswear3d: correct back overlay orientation"
          git push origin HEAD:sol/mt3d-football-production-20260816
