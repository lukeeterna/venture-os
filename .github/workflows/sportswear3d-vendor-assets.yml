name: Sportswear3D Vendor Assets

on:
  push:
    branches:
      - sol/mt3d-football-production-20260816
    paths:
      - .github/workflows/sportswear3d-vendor-assets.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: sol/mt3d-football-production-20260816
          fetch-depth: 0

      - name: Download pinned MIT garment assets and Three.js loaders
        shell: bash
        run: |
          set -euo pipefail
          ROOT="ventures/run_20260711_161411/configurator"
          ASSETS="$ROOT/assets/vendor"
          THREE="$ROOT/vendor/three-r160/examples/jsm"
          mkdir -p "$ASSETS" "$THREE/loaders" "$THREE/utils" "$THREE/environments" "$ROOT/verify"

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pmndrs/examples/be95c387abb15d41d388bca4e2d1568690935a5c/examples/t-shirt-configurator/src/shirt_baked_collapsed.glb" \
            -o "$ASSETS/football-shirt.glb"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pmndrs/examples/be95c387abb15d41d388bca4e2d1568690935a5c/examples/t-shirt-configurator/src/shirt_baked_2.glb" \
            -o "$ASSETS/football-shirt-baked2.glb"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/pmndrs/examples/be95c387abb15d41d388bca4e2d1568690935a5c/examples/t-shirt-configurator/src/shirt_baked_lower2.glb" \
            -o "$ASSETS/football-shirt-lower2.glb"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/madjin/asset-pallet/7243319029382f5799f03162cc6bf10795f9951d/models/tshirt_apose2.glb" \
            -o "$ASSETS/football-shirt-madjin-apose2.glb"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/madjin/asset-pallet/7243319029382f5799f03162cc6bf10795f9951d/models/shorts.glb" \
            -o "$ASSETS/football-shorts.glb"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/madjin/asset-pallet/7243319029382f5799f03162cc6bf10795f9951d/models/socks.glb" \
            -o "$ASSETS/football-socks.glb"

          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/mrdoob/three.js/d04539a76736ff500cae883d6a38b3dd8643c548/examples/jsm/loaders/GLTFLoader.js" \
            -o "$THREE/loaders/GLTFLoader.js"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/mrdoob/three.js/d04539a76736ff500cae883d6a38b3dd8643c548/examples/jsm/utils/BufferGeometryUtils.js" \
            -o "$THREE/utils/BufferGeometryUtils.js"
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/mrdoob/three.js/d04539a76736ff500cae883d6a38b3dd8643c548/examples/jsm/environments/RoomEnvironment.js" \
            -o "$THREE/environments/RoomEnvironment.js"

      - name: Verify upstream Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          ROOT="ventures/run_20260711_161411/configurator/assets/vendor"
          check_blob() {
            local file="$1" expected="$2"
            actual="$(git hash-object "$file")"
            printf '%s  %s\n' "$actual" "$file"
            test "$actual" = "$expected"
          }
          check_blob "$ROOT/football-shirt.glb"                9c7609eddfd597a70cb708f96bc19841766b3488
          check_blob "$ROOT/football-shirt-baked2.glb"         b8fdcbcfacf9b842323045009a10b70abe1d8889
          check_blob "$ROOT/football-shirt-lower2.glb"         1a14068cb85a72e12d82cd58dc7cc7840d1d693e
          check_blob "$ROOT/football-shirt-madjin-apose2.glb"  f647d5e712bf3f660e94edfca740c96cded5796d
          check_blob "$ROOT/football-shorts.glb"               3222095f45778676f967c08bf1962af5306e111b
          check_blob "$ROOT/football-socks.glb"                44667afdfc03d73aad1b556899d41f4af8a6f2e3
          echo "DONOR_BINARY_BLOBS=PASS"

      - name: Record donor GLB geometry metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, struct
          root = pathlib.Path('ventures/run_20260711_161411/configurator')
          assets = root / 'assets' / 'vendor'
          out = {}
          for path in sorted(assets.glob('football-*.glb')):
              data = path.read_bytes()
              magic, version, length = struct.unpack_from('<4sII', data, 0)
              assert magic == b'glTF' and version == 2 and length == len(data)
              off = 12
              doc = None
              while off < len(data):
                  chunk_len, chunk_type = struct.unpack_from('<II', data, off)
                  off += 8
                  chunk = data[off:off + chunk_len]
                  off += chunk_len
                  if chunk_type == 0x4E4F534A:
                      doc = json.loads(chunk.rstrip(b' \t\r\n\x00').decode('utf-8'))
                      break
              assert doc is not None
              accessors = doc.get('accessors', [])
              meshes = []
              for mi, mesh in enumerate(doc.get('meshes', [])):
                  primitives = []
                  for pi, prim in enumerate(mesh.get('primitives', [])):
                      pos_idx = prim.get('attributes', {}).get('POSITION')
                      acc = accessors[pos_idx] if pos_idx is not None else {}
                      primitives.append({'primitive': pi, 'position_accessor': pos_idx, 'min': acc.get('min'), 'max': acc.get('max'), 'material': prim.get('material')})
                  meshes.append({'index': mi, 'name': mesh.get('name'), 'primitives': primitives})
              out[path.name] = {
                  'generator': doc.get('asset', {}).get('generator'),
                  'nodes': [{'name': n.get('name'), 'mesh': n.get('mesh'), 'translation': n.get('translation'), 'rotation': n.get('rotation'), 'scale': n.get('scale')} for n in doc.get('nodes', [])],
                  'meshes': meshes,
                  'materials': [m.get('name') for m in doc.get('materials', [])]
              }
          report = root / 'verify' / 'DONOR_MODEL_REPORT.json'
          report.write_text(json.dumps(out, indent=2, sort_keys=True) + '\n')
          print(report.read_text())
          PY

      - name: Commit verified donor runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sportswear3d-ci"
          git config user.email "sportswear3d-ci@users.noreply.github.com"
          git add -- \
            ventures/run_20260711_161411/configurator/assets/vendor/football-shirt.glb \
            ventures/run_20260711_161411/configurator/assets/vendor/football-shirt-baked2.glb \
            ventures/run_20260711_161411/configurator/assets/vendor/football-shirt-lower2.glb \
            ventures/run_20260711_161411/configurator/assets/vendor/football-shirt-madjin-apose2.glb \
            ventures/run_20260711_161411/configurator/assets/vendor/football-shorts.glb \
            ventures/run_20260711_161411/configurator/assets/vendor/football-socks.glb \
            ventures/run_20260711_161411/configurator/vendor/three-r160/examples/jsm/loaders/GLTFLoader.js \
            ventures/run_20260711_161411/configurator/vendor/three-r160/examples/jsm/utils/BufferGeometryUtils.js \
            ventures/run_20260711_161411/configurator/vendor/three-r160/examples/jsm/environments/RoomEnvironment.js \
            ventures/run_20260711_161411/configurator/verify/DONOR_MODEL_REPORT.json
          if git diff --cached --quiet; then
            echo "No vendor changes required"
            exit 0
          fi
          git commit -m "sportswear3d: vendor verified athletic shirt candidate"
          git push origin HEAD:sol/mt3d-football-production-20260816
